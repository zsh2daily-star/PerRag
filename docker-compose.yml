# ── RAG 系统 Docker Compose 编排 ──────────────────────────
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f
#
# 注意:
#   - Ollama (qwen3:8b) 运行在宿主机，不在容器中
#   - 容器通过 host.docker.internal 访问宿主机服务
#   - shared-rag 是 external 网络，连接 hermes-webui

services:
  # ── FastAPI RAG 应用 ──────────────────────────────────
  rag-api:
    build: .
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Qdrant 向量数据库
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-rag_documents}
      # 嵌入模型
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      # 文档处理
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - PDF_PARSER=${PDF_PARSER:-mineru}
      - IMPORT_DIR=/app/data/uploads
      - EXCLUDE_PATHS=${EXCLUDE_PATHS:-}
      # MinerU PDF 解析
      - MINERU_HOST=mineru
      - MINERU_PORT=8000
      - MINERU_BACKEND=pipeline
      - MINERU_LANG=ch
      - MINERU_TIMEOUT=${MINERU_TIMEOUT:-600}
      - MINERU_VRAM_THRESHOLD=${MINERU_VRAM_THRESHOLD:-0.65}
      - MINERU_RESTART_EVERY_N=${MINERU_RESTART_EVERY_N:-10}
      - MINERU_PAGE_CHUNK_SIZE=${MINERU_PAGE_CHUNK_SIZE:-20}
      - MINERU_MIN_CHUNK_SIZE=${MINERU_MIN_CHUNK_SIZE:-5}
      - MINERU_CHUNK_RESTART_EVERY=${MINERU_CHUNK_RESTART_EVERY:-5}
      # Ollama 大模型 —— 宿主机，通过 host.docker.internal 访问
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-qwen3:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # API 远程模型（可选）
      - API_DEFAULT_MODEL=${API_DEFAULT_MODEL:-deepseek-chat}
      - API_DEFAULT_BASE=${API_DEFAULT_BASE:-https://api.deepseek.com}
      - LLM_KEYS=${LLM_KEYS:-{"deepseek":""}}
      # API 鉴权（非空时所有接口需要 X-API-Key header）
      - RAG_API_KEY=${RAG_API_KEY:-}
      # RRF 融合权重
      - RRF_DENSE_WEIGHT=${RRF_DENSE_WEIGHT:-1.0}
      - RRF_SPARSE_WEIGHT=${RRF_SPARSE_WEIGHT:-1.0}
      # HyDE 检索优化
      - HYDE_ENABLED=${HYDE_ENABLED:-false}
      # 语义分块
      - CHUNK_METHOD=${CHUNK_METHOD:-fixed}
      # 多模态（MinerU 图片提取）
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-false}
      - MULTIMODAL_IMAGE_DIR=/app/data/images
      # 检索参数
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-30}
      - RERANK_TOP_K=${RERANK_TOP_K:-5}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:-16}
      # 模型缓存
      - HF_HOME=/app/models
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/mineru:/app/data/mineru
      - ./models:/app/models
      - ./app:/app/app
      - /mnt/公司文件/公司内部文件:/app/data/ragtemp:ro
      - /mnt/个人文件:/app/data/personal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rag-network
      - shared-rag
    depends_on:
      qdrant:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Qdrant 向量数据库 ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-network

  # ── MinerU PDF 解析服务 ────────────────────────────────
  mineru:
    image: t300/mineru:0.8.1-paddle-gpu-20251229-01
    container_name: mineru
    restart: unless-stopped
    ports:
      - "30001:8000"
    volumes:
      - ./data/mineru:/tmp/mineru
      - ./models/mineru:/opt/models
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_ENDPOINT=https://hf-mirror.com

  # ── Open WebUI 聊天前端 ───────────────────────────────
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/openwebui:/app/backend/data
    networks:
      - rag-network
      - shared-rag
    environment:
      # 连接宿主机上的 Ollama（通过 host.docker.internal）
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # 连接 RAG API（OpenAI 兼容端点）
      - OPENAI_API_BASE_URLS=http://rag-api:8000/v1
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-in-production}
      # HuggingFace 镜像（加速国内模型下载）
      - HF_ENDPOINT=https://hf-mirror.com
    depends_on:
      - rag-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── 网络 ──────────────────────────────────────────────────
networks:
  rag-network:
    driver: bridge
    name: rag-network
  shared-rag:
    external: true
    name: shared-rag

# ── 卷 ──────────────────────────────────────────────────
